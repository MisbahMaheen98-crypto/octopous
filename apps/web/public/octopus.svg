  <path d="M50 15 C30 15 22 28 22 45 C22 56 30 65 42 67 L42 74 C42 75 40 78 35 80 C30 82 25 80 23 78" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glow)"/>
